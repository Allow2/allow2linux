app-id: com.allow2.allow2linux
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: allow2linux

finish-args:
  # Display access (Wayland + X11 + framebuffer for SDL2 overlay)
  - --socket=wayland
  - --socket=x11
  - --socket=fallback-x11
  - --device=dri

  # Network for Allow2 API communication
  - --share=network

  # Read /proc for process classification
  - --filesystem=/proc:ro

  # Home directory for credentials (~/.allow2/) and config
  - --filesystem=home

  # Session bus for desktop notifications (notify-send)
  - --socket=session-bus
  - --talk-name=org.freedesktop.Notifications

  # System bus for loginctl (session lock/terminate)
  - --system-talk-name=org.freedesktop.login1

  # Access to libsecret (credential storage)
  - --talk-name=org.freedesktop.secrets

  # Unix sockets for overlay IPC
  - --filesystem=/tmp

modules:
  # ── Node.js 20 LTS ──────────────────────────────────────────
  - name: nodejs
    buildsystem: simple
    build-commands:
      - install -D -m 755 bin/node /app/bin/node
      - mkdir -p /app/lib
      - cp -r lib/node_modules /app/lib/node_modules
      - ln -s ../lib/node_modules/npm/bin/npm-cli.js /app/bin/npm
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://nodejs.org/dist/v20.18.0/node-v20.18.0-linux-x64.tar.gz
        sha256: 24a5d58a1d4c2903478f4b7c3cfd2eeb5cea2cae3baee11a4dc6a1fed25fec6c
      - type: archive
        only-arches:
          - aarch64
        url: https://nodejs.org/dist/v20.18.0/node-v20.18.0-linux-arm64.tar.gz
        sha256: 38bccb35c06ee4edbcd00c77976e3fad1d69d2e57c3c0c363d1700a2a2493278

  # ── allow2-lock-overlay (C + SDL2) ──────────────────────────
  - name: allow2-lock-overlay
    buildsystem: simple
    build-commands:
      - make
      - install -D -m 755 allow2-lock-overlay /app/bin/allow2-lock-overlay
      - install -D -m 644 assets/Inter-Regular.ttf /app/bin/assets/Inter-Regular.ttf
      - install -D -m 644 assets/Inter-Bold.ttf /app/bin/assets/Inter-Bold.ttf
    sources:
      - type: dir
        path: ../packages/allow2-lock-overlay

  # ── allow2linux daemon (Node.js) ────────────────────────────
  # All deps (allow2 SDK + ws + transitive) installed via npm from registry
  - name: allow2linux
    buildsystem: simple
    # DEV manifest only: allow network during build so `npm install` can fetch
    # the published `allow2` SDK + `ws` from the registry. (The Flathub manifest
    # instead uses an offline yarn mirror via node-sources.json — no network.)
    build-options:
      build-args:
        - --share=network
    build-commands:
      - mkdir -p /app/lib/allow2linux
      - cp -r src config systemd package.json /app/lib/allow2linux/
      - cd /app/lib/allow2linux && /app/bin/npm install --omit=dev --no-optional
      # Install the launcher script
      - install -D -m 755 allow2linux.sh /app/bin/allow2linux
      # Desktop entry, metainfo, and icon from data/
      - install -D -m 644 data/com.allow2.allow2linux.desktop /app/share/applications/com.allow2.allow2linux.desktop
      - install -D -m 644 data/com.allow2.allow2linux.metainfo.xml /app/share/metainfo/com.allow2.allow2linux.metainfo.xml
      - install -D -m 644 data/icons/hicolor/scalable/apps/com.allow2.allow2linux.svg /app/share/icons/hicolor/scalable/apps/com.allow2.allow2linux.svg
    sources:
      - type: dir
        path: ../packages/allow2linux
      # Pull in data/ from repo root
      - type: dir
        path: ../data
        dest: data
      # Launcher script — CHANNEL-SPECIFIC, generated by gen-launcher.sh.
      # ONE manifest, TWO channels (staging=beta / production=stable): the launcher
      # is the only per-channel artifact, so there are no divergent manifests.
      # Every build entry point (build.sh, publish.sh, CI) runs
      #   CHANNEL=<staging|production> flatpak/gen-launcher.sh
      # to write allow2linux.launcher.sh BEFORE flatpak-builder runs.
      #   staging    → OMITS the production flag, bakes ALLOW2_ENV=staging (beta testers)
      #   production → bakes ALLOW2_PRODUCTION=1 + NODE_ENV=production (staging unreachable)
      # The file is gitignored; a naked `flatpak-builder` without generating it first
      # will fail (by design) rather than silently ship the wrong endpoint.
      - type: file
        path: allow2linux.launcher.sh
        dest-filename: allow2linux.sh
