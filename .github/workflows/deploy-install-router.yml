name: Deploy install-router (Cloudflare Worker)

# Deploys the install-funnel Worker (workers/install-router) to Cloudflare. The
# Worker is data-driven — per-platform install URLs live in R2 manifests, not in
# the Worker — so this pipeline only ships the routing logic. It is CO-HOSTED as
# a staging+prod pair on get.allow2.com (two envs of the same code).
#
# Branch → env (ecosystem convention; the old default branch is being retired —
# only `staging` and `main` drive deploys):
#   push to `main`    → deploy --env production  (route get.allow2.com/install, stable, indexable)
#   push to `staging` → deploy --env staging     (route get.allow2.com/staging, staging pages, noindex)
#   pull_request      → deploy --env production --dry-run (validate only, nothing published)
#
# ── Secrets (repo/org settings → Actions → Secrets) ──────────────────────────
#   CF_WORKERS_API_TOKEN     Cloudflare API token for Workers deploys. Create it
#                            from the "Edit Cloudflare Workers" API-token TEMPLATE,
#                            zone-scoped to allow2.com (it needs Workers Scripts +
#                            Workers Routes edit on that zone). This is DISTINCT
#                            from the existing CLOUDFLARE_API_TOKEN used by
#                            publish.yml, which is a cache-purge-only token and
#                            CANNOT deploy Workers. Keep them separate.
#   CLOUDFLARE_ACCOUNT_ID    Cloudflare account id that owns the Worker.
#
# NOTE: this is separate from the R2/GPG secret set used by publish.yml — a
# Worker deploy needs neither R2 credentials nor the Flatpak signing key.

on:
  push:
    branches: [staging, main]     # staging → staging env, main → production env
    paths:
      - 'workers/install-router/**'
      - '.github/workflows/deploy-install-router.yml'
  pull_request:
    paths:
      - 'workers/install-router/**'
      - '.github/workflows/deploy-install-router.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Which env to deploy
        type: choice
        options:
          - production
          - staging
        default: production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Separate, if:-gated steps per target (clearer than one nested expression).
      # wrangler-action@v4 (bundles Wrangler 4) is REQUIRED: GitHub runners now
      # default to Node 24 (Node 20 deprecated), and the old Wrangler 3.90.0 pin
      # crashed on `deploy` under Node 24. Wrangler 4 supports Node 20+/24. We let
      # @v4 use its bundled Wrangler 4 (no wranglerVersion pin) so the deploy
      # tracks a Node-24-compatible toolchain.

      - name: Deploy production (push to main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_WORKERS_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/install-router
          # Real deploy: binds the production route get.allow2.com/install
          # (stable pages, indexable) per wrangler.toml [env.production].
          command: deploy --env production

      - name: Deploy staging (push to staging)
        if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_WORKERS_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/install-router
          # Real deploy: binds the staging route get.allow2.com/staging
          # (staging pages, noindex) per wrangler.toml [env.staging].
          command: deploy --env staging

      - name: Validate (pull_request, dry-run)
        if: github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_WORKERS_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/install-router
          # Validate only — no route claimed, nothing published.
          command: deploy --env production --dry-run

      - name: Deploy (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_WORKERS_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/install-router
          # Real deploy of the operator-chosen env (production or staging) per
          # wrangler.toml [env.<environment>]. Manual "Run workflow" button.
          command: deploy --env ${{ inputs.environment }}
