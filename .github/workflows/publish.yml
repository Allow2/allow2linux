name: Publish (Flatpak → R2)

# Builds the x86_64 Flatpak and publishes the ostree repo to a channel-specific
# prefix on Cloudflare R2 (served at https://get.allow2.com/steamdeck/<channel>/).
# Users pick it up via `flatpak update` / the auto-update timer.
#
# Two channels, two independent R2 prefixes (see docs/BETA_DELIVERY.md):
#   staging channel   → push to `staging` branch  → publish.sh staging    → /steamdeck/staging/
#   production channel → push a `vX.Y.Z` tag       → publish.sh production → /steamdeck/stable/
#
# Secrets (repo/org settings → Actions → Secrets):
#   R2_ACCOUNT_ID  R2_BUCKET  R2_ACCESS_KEY_ID  R2_SECRET_ACCESS_KEY
#   CLOUDFLARE_API_TOKEN  CLOUDFLARE_ZONE_ID
#   ALLOW2_FLATPAK_GPG_PRIVATE_KEY  (armored private key of the dedicated,
#                                    passphraseless Flatpak signing key)
#   ALLOW2_FLATPAK_GPG_KEYID        (key id / uid / fingerprint, e.g. ops@allow2.com)
#
# Variables (repo/org settings → Actions → Variables — NOT Secrets; vid/token are
# type identifiers, not secrets):
#   ALLOW2_STAGING_VID  ALLOW2_STAGING_TOKEN   (defaults 21341 / QhkiFFPVfMkUjLUR)
#   ALLOW2_PROD_VID     ALLOW2_PROD_TOKEN      (defaults 21599 / x9AUeUPpiweHTNCR)
#
# NOTE: the flatpak-builder run itself is [unverified-device] from the authoring
# environment — validate it on a real x86_64 Linux host (this runner is one) and
# test-install the result on the Steam Deck.

on:
  push:
    branches: [staging]            # → staging channel (rolling betas)
    tags: ['v*.*.*']               # → production channel (semver releases)
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel to build+publish'
        default: staging
        type: choice
        options: [staging, production]

concurrency:
  # Serialise per-channel so two runs never race the same R2 prefix.
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve channel + version
        id: chan
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANNEL="${{ inputs.channel }}"
            VERSION="manual-$(git rev-parse --short HEAD)"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            CHANNEL="production"
            VERSION="${GITHUB_REF_NAME}"                     # the semver tag
          else
            CHANNEL="staging"
            VERSION="staging-$(git rev-parse --short HEAD)"  # rolling build id
          fi
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "==> channel=${CHANNEL}  version=${VERSION}"

      - name: Install flatpak + flatpak-builder + aws
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder curl unzip
          # AWS CLI v2 via the official installer — the `awscli` apt package was
          # dropped in Ubuntu 24.04 (noble), so `apt-get install awscli` has no
          # candidate. (This is also aws-cli >=2.23, which is why publish.sh passes
          # --checksum-algorithm CRC32 for R2.)
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          unzip -q -o /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install --update
          sudo flatpak remote-add --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub \
            org.freedesktop.Platform//23.08 org.freedesktop.Sdk//23.08

      - name: Import Flatpak signing key
        # Provisions the GPG signing key publish.sh requires. A fresh ubuntu-latest
        # runner has NO key, so without this step publish.sh aborts with
        # "ALLOW2_FLATPAK_GPG_KEYID is not set". We import a passphraseless dedicated
        # signing key (armored private export held as a Secret) into a throwaway
        # keyring under $RUNNER_TEMP, then hand the keyid + homedir to publish.sh via
        # $GITHUB_ENV. Passphraseless ⇒ no pinentry/agent-preset wiring is needed.
        # See docs/BETA_DELIVERY.md "Operator setup".
        env:
          ALLOW2_FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.ALLOW2_FLATPAK_GPG_PRIVATE_KEY }}
          ALLOW2_FLATPAK_GPG_KEYID:        ${{ secrets.ALLOW2_FLATPAK_GPG_KEYID }}
        run: |
          set -euo pipefail
          # Fail EARLY with a pointed message rather than falling through to
          # publish.sh's generic "keyid not set" error.
          if [ -z "${ALLOW2_FLATPAK_GPG_PRIVATE_KEY}" ] || [ -z "${ALLOW2_FLATPAK_GPG_KEYID}" ]; then
            echo "ERROR: Flatpak signing secrets are missing." >&2
            echo "  Set BOTH repo Actions secrets:" >&2
            echo "    ALLOW2_FLATPAK_GPG_PRIVATE_KEY  (ASCII-armored export of the" >&2
            echo "                                     passphraseless signing key)" >&2
            echo "    ALLOW2_FLATPAK_GPG_KEYID        (key id / uid / fingerprint)" >&2
            echo "  See docs/BETA_DELIVERY.md 'Operator setup'." >&2
            exit 1
          fi
          # Throwaway keyring home, isolated from any default ~/.gnupg.
          HOME_DIR="${RUNNER_TEMP}/flatpak-gpg"
          mkdir -p "${HOME_DIR}"
          chmod 700 "${HOME_DIR}"
          # printf '%s' (not echo) preserves the multiline armor exactly; quoting the
          # var keeps newlines intact.
          printf '%s' "${ALLOW2_FLATPAK_GPG_PRIVATE_KEY}" \
            | gpg --homedir "${HOME_DIR}" --batch --import
          # Verify a SECRET key actually landed — a bad/empty armor imports nothing.
          if ! gpg --homedir "${HOME_DIR}" --list-secret-keys --keyid-format=long | grep -q '^sec'; then
            echo "ERROR: no secret key was imported into ${HOME_DIR}." >&2
            echo "  ALLOW2_FLATPAK_GPG_PRIVATE_KEY must be a valid armored private-key" >&2
            echo "  export: gpg --homedir <dir> --armor --export-secret-keys <keyid>." >&2
            echo "  See docs/BETA_DELIVERY.md 'Operator setup'." >&2
            exit 1
          fi
          # Hand the signing inputs to publish.sh (and the Build step) via the job env.
          echo "ALLOW2_FLATPAK_GPG_HOMEDIR=${HOME_DIR}" >> "$GITHUB_ENV"
          echo "ALLOW2_FLATPAK_GPG_KEYID=${ALLOW2_FLATPAK_GPG_KEYID}" >> "$GITHUB_ENV"
          echo "==> imported Flatpak signing key (keyid=${ALLOW2_FLATPAK_GPG_KEYID}, homedir=${HOME_DIR})"

      - name: Build + publish
        env:
          # R2 + Cloudflare (Secrets)
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET:            ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID:   ${{ secrets.CLOUDFLARE_ZONE_ID }}
          # vid/token type identifiers (Variables, NOT Secrets). gen-launcher.sh
          # falls back to the known type ids if a Variable is unset.
          ALLOW2_STAGING_VID:   ${{ vars.ALLOW2_STAGING_VID }}
          ALLOW2_STAGING_TOKEN: ${{ vars.ALLOW2_STAGING_TOKEN }}
          ALLOW2_PROD_VID:      ${{ vars.ALLOW2_PROD_VID }}
          ALLOW2_PROD_TOKEN:    ${{ vars.ALLOW2_PROD_TOKEN }}
          ALLOW2_VERSION:       ${{ steps.chan.outputs.version }}
          # GPG signing — the "Import Flatpak signing key" step above wrote these to
          # $GITHUB_ENV, so they already inherit here; re-declaring them from the env
          # context is self-documenting (and harmless — same values, no conflict).
          ALLOW2_FLATPAK_GPG_KEYID:   ${{ env.ALLOW2_FLATPAK_GPG_KEYID }}
          ALLOW2_FLATPAK_GPG_HOMEDIR: ${{ env.ALLOW2_FLATPAK_GPG_HOMEDIR }}
        run: |
          chmod +x scripts/publish.sh flatpak/gen-launcher.sh
          ./scripts/publish.sh "${{ steps.chan.outputs.channel }}"
